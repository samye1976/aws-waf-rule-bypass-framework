<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680"><rect width="1600" height="680" fill="#fff"/><text x="60" y="58" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="30" fill="#111" font-weight="bold" text-anchor="start">One backfill rule, many branches: any branch true → Block</text><text x="60" y="96" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="20" fill="#555" font-weight="normal" text-anchor="start">Each branch = the sub-rule&#x27;s hit label AND NOT its exemption label</text><rect x="60" y="129" width="134.31" height="38" rx="19" fill="#fdf0e6" stroke="#c0602a" stroke-width="2"/><text x="127.155" y="155" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#c0602a" font-weight="bold" text-anchor="middle">Hit label</text><text x="208.31" y="155" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#444" font-weight="normal" text-anchor="start">added by the AMR sub-rule on match (AWS-defined)</text><rect x="780" y="129" width="203.85" height="38" rx="19" fill="#3d8b55"/><text x="881.925" y="155" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#fff" font-weight="bold" text-anchor="middle">Exemption label</text><text x="997.85" y="155" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#444" font-weight="normal" text-anchor="start">added by the mapping layer (ours)</text><rect x="60" y="230" width="330" height="300" rx="16" fill="#f3ecfa" stroke="#7b47a8" stroke-width="3"/><text x="225" y="300" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#222" font-weight="bold" text-anchor="middle">enforce-crs-block</text><text x="225" y="342" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#444" font-weight="normal" text-anchor="middle">Backfill rule</text><text x="225" y="380" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#666" font-weight="normal" text-anchor="middle">After CRS (priority +5)</text><text x="225" y="460" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#7b47a8" font-weight="bold" text-anchor="middle">Action: Block</text><line x1="390" y1="380" x2="466" y2="380" stroke="#7b47a8" stroke-width="4"/><circle cx="500" cy="380" r="34" fill="#7b47a8"/><text x="500" y="389" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="24" fill="#fff" font-weight="bold" text-anchor="middle">OR</text><path d="M534,380 C580,380 560,250 620,250" fill="none" stroke="#7b47a8" stroke-width="3"/><rect x="620" y="208" width="920" height="84" rx="12" fill="#fff" stroke="#c0602a" stroke-width="2"/><rect x="644" y="231" width="273.39" height="38" rx="19" fill="#fdf0e6" stroke="#c0602a" stroke-width="2"/><text x="780.6949999999999" y="257" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#c0602a" font-weight="bold" text-anchor="middle">SizeRestrictions_Body</text><text x="939.39" y="258" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#222" font-weight="bold" text-anchor="start">AND NOT</text><rect x="1051.06" y="231" width="250.21" height="38" rx="19" fill="#3d8b55"/><text x="1176.165" y="257" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#fff" font-weight="bold" text-anchor="middle">exempt:crs_sizebody</text><path d="M534,380 C580,380 560,380 620,380" fill="none" stroke="#7b47a8" stroke-width="3"/><rect x="620" y="338" width="920" height="84" rx="12" fill="#fff" stroke="#c0602a" stroke-width="2"/><rect x="644" y="361" width="238.62" height="38" rx="19" fill="#fdf0e6" stroke="#c0602a" stroke-width="2"/><text x="763.31" y="387" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#c0602a" font-weight="bold" text-anchor="middle">NoUserAgent_Header</text><text x="904.62" y="388" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#222" font-weight="bold" text-anchor="start">AND NOT</text><rect x="1016.29" y="361" width="284.98" height="38" rx="19" fill="#3d8b55"/><text x="1158.78" y="387" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#fff" font-weight="bold" text-anchor="middle">exempt:crs_nouseragent</text><path d="M534,380 C580,380 560,510 620,510" fill="none" stroke="#7b47a8" stroke-width="3"/><rect x="620" y="468" width="920" height="84" rx="12" fill="#fafafa" stroke="#888" stroke-width="2" stroke-dasharray="10,8"/><rect x="644" y="491" width="331.34" height="38" rx="19" fill="#eee" stroke="#bbb" stroke-width="2"/><text x="809.67" y="517" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#666" font-weight="bold" text-anchor="middle">Sub-rules onboarded later…</text><text x="997.3399999999999" y="518" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="21" fill="#222" font-weight="bold" text-anchor="start">AND NOT</text><rect x="1109.01" y="491" width="215.44" height="38" rx="19" fill="#999"/><text x="1216.73" y="517" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="19" fill="#fff" font-weight="bold" text-anchor="middle">exempt:&lt;rule-ID&gt;</text><text x="60" y="612" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="19" fill="#555" font-weight="normal" text-anchor="start">A request with exempt:crs_sizebody skips only the size check; if it also lacks a User-Agent,</text><text x="60" y="642" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="19" fill="#555" font-weight="normal" text-anchor="start">branch 2 still fires → Block. Branches are independent.</text></svg>