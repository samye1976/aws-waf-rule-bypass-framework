<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1060" viewBox="0 0 2000 1060"><rect width="2000" height="1060" fill="#fff"/><text x="60" y="72" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="38" fill="#111" font-weight="bold" text-anchor="start">AWS WAF label exemptions: three layers and three configuration stages</text><text x="60" y="116" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="19" fill="#555" font-weight="normal" text-anchor="start">Wire the detection layer once; day to day, only the feature and mapping layers change. 1 detection rule ↔ 1 mapping rule ↔ 1 label exempt:&lt;rule-ID&gt;</text><text x="60" y="152" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="24" fill="#222" font-weight="bold" text-anchor="start">Request evaluation order (lowest priority number first)</text><rect x="440" y="192" width="792" height="448" rx="22" fill="none" stroke="#3d8b55" stroke-width="3" stroke-dasharray="14,9"/><rect x="60" y="372" width="125" height="96" rx="12" fill="#f2f2f2" stroke="#999" stroke-width="2"/><text x="122" y="429" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="24" fill="#222" font-weight="bold" text-anchor="middle">Request</text><line x1="185" y1="420" x2="208" y2="420" stroke="#555" stroke-width="5"/><polygon points="222,420 204,409 204,431" fill="#555"/><rect x="222" y="325" width="200" height="190" rx="12" fill="#f7f7f7" stroke="#999" stroke-width="2"/><text x="322" y="370" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#333" font-weight="bold" text-anchor="middle">AntiDDoS AMR</text><text x="322" y="408" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="20" fill="#333" font-weight="normal" text-anchor="middle">Priority 0</text><text x="322" y="446" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="20" fill="#333" font-weight="normal" text-anchor="middle">Built-in URI</text><text x="322" y="484" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="20" fill="#333" font-weight="normal" text-anchor="middle">exemption</text><line x1="422" y1="420" x2="444" y2="420" stroke="#555" stroke-width="5"/><polygon points="458,420 440,409 440,431" fill="#555"/><rect x="458" y="210" width="340" height="410" rx="16" fill="#eaf1fb" stroke="#3f72b5" stroke-width="3"/><text x="628.0" y="270" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="30" fill="#222" font-weight="bold" text-anchor="middle">Feature layer</text><text x="628.0" y="312" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="20" fill="#555" font-weight="normal" text-anchor="middle">Action: Count</text><text x="628.0" y="352" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">Identifies the request</text><rect x="487.22" y="378" width="281.56" height="44" rx="22.0" fill="#3f72b5"/><text x="628.0" y="406.48" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">feat:&lt;category&gt;:&lt;name&gt;</text><text x="628.0" y="462" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#555" font-weight="normal" text-anchor="middle">e.g. feat:path:upload</text><text x="628.0" y="500" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="19" fill="#555" font-weight="normal" text-anchor="middle">Reusable by multiple</text><text x="628.0" y="526" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="19" fill="#555" font-weight="normal" text-anchor="middle">mapping rules</text><text x="628.0" y="580" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#3f72b5" font-weight="bold" text-anchor="middle">Built in stage 2</text><line x1="798" y1="420" x2="820" y2="420" stroke="#555" stroke-width="5"/><polygon points="834,420 816,409 816,431" fill="#555"/><rect x="834" y="210" width="380" height="410" rx="16" fill="#ebf5ee" stroke="#3d8b55" stroke-width="3"/><text x="1024.0" y="270" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="30" fill="#222" font-weight="bold" text-anchor="middle">Mapping layer</text><text x="1024.0" y="312" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="20" fill="#555" font-weight="normal" text-anchor="middle">Action: Count</text><text x="1024.0" y="352" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#333" font-weight="normal" text-anchor="middle">One per detection rule</text><rect x="916.16" y="378" width="215.68" height="44" rx="22.0" fill="#3d8b55"/><text x="1024.0" y="406.48" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">exempt:&lt;rule-ID&gt;</text><text x="1024.0" y="462" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#555" font-weight="normal" text-anchor="middle">e.g. map-crs_sizebody</text><text x="1024.0" y="494" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#555" font-weight="normal" text-anchor="middle">→ exempt:crs_sizebody</text><text x="1024.0" y="534" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#555" font-weight="normal" text-anchor="middle">Initial match: NOT (match-all)</text><text x="1024.0" y="580" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="19" fill="#3d8b55" font-weight="bold" text-anchor="middle">Day to day: edit match only</text><line x1="1214" y1="420" x2="1236" y2="420" stroke="#555" stroke-width="5"/><polygon points="1250,420 1232,409 1232,431" fill="#555"/><rect x="1250" y="195" width="690" height="445" rx="18" fill="#fdf6ef" stroke="#c0602a" stroke-width="3"/><text x="1278" y="240" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="22" fill="#222" font-weight="bold" text-anchor="start">Detection layer — full-label match</text><rect x="1272" y="262" width="646" height="82" rx="10" fill="#fff" stroke="#e3c9b3" stroke-width="2"/><text x="1292" y="295" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#222" font-weight="bold" text-anchor="start">Custom / rate-based rule</text><text x="1292" y="330" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#444" font-weight="normal" text-anchor="start">AND NOT exempt:&lt;rule-ID&gt; (rate-based: in scope-down)</text><rect x="1272" y="356" width="646" height="82" rx="10" fill="#fff" stroke="#e3c9b3" stroke-width="2"/><text x="1292" y="389" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#222" font-weight="bold" text-anchor="start">AMR whole-group exemption</text><text x="1292" y="424" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#444" font-weight="normal" text-anchor="start">scope-down: NOT exempt:&lt;group-ID&gt;</text><rect x="1272" y="450" width="646" height="170" rx="10" fill="#fff" stroke="#e3c9b3" stroke-width="2"/><text x="1292" y="483" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#222" font-weight="bold" text-anchor="start">AMR sub-rule exemption</text><rect x="1292" y="502" width="278.0" height="98" rx="8" fill="#f4f4f4" stroke="#999" stroke-width="2"/><text x="1431.0" y="534" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="20" fill="#222" font-weight="bold" text-anchor="middle">AMR rule group</text><text x="1431.0" y="566" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">Common sub-rules → Count</text><text x="1431.0" y="590" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">still add hit labels</text><line x1="1570.0" y1="551" x2="1606.0" y2="551" stroke="#555" stroke-width="5"/><polygon points="1620.0,551 1602.0,540 1602.0,562" fill="#555"/><rect x="1620.0" y="502" width="278.0" height="98" rx="8" fill="#f3ecfa" stroke="#7b47a8" stroke-width="3"/><text x="1759.0" y="534" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="20" fill="#222" font-weight="bold" text-anchor="middle">Backfill rule</text><text x="1759.0" y="566" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">Hit label &amp; no exemption</text><text x="1759.0" y="590" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="17" fill="#555" font-weight="normal" text-anchor="middle">→ Block (right after AMR)</text><rect x="472.78" y="170" width="726.44" height="44" rx="22" fill="#3d8b55"/><text x="836.0" y="200" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle">Centrally managed: day-to-day changes only here</text><text x="60" y="700" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="27" fill="#222" font-weight="bold" text-anchor="start">Three configuration stages</text><text x="547.3199999999999" y="700" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#666" font-weight="normal" text-anchor="start">Build the framework once; day to day is just two steps</text><rect x="60" y="725" width="580" height="290" rx="14" fill="#fff" stroke="#c9ced4" stroke-width="2"/><path d="M60,739 a14,14 0 0 1 14,-14 h552 a14,14 0 0 1 14,14 v50 h-580 z" fill="#3b4a5c"/><text x="86" y="769" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="25" fill="#fff" font-weight="bold" text-anchor="start">1  Initial setup</text><text x="616" y="768" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#fff" font-weight="normal" text-anchor="end">One-off · no change</text><text x="90" y="837" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">Wire detection: NOT exempt + backfill</text><text x="90" y="881" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">One mapping rule per rule (no match yet)</text><text x="90" y="925" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#666" font-weight="bold" text-anchor="start">Feature layer not built yet</text><text x="90" y="987" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#555" font-weight="normal" text-anchor="start">Change:</text><rect x="172" y="961" width="136.92000000000002" height="38" rx="19" fill="#c0602a"/><text x="240.46" y="987" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">Detection</text><rect x="320.92" y="961" width="113.16000000000001" height="38" rx="19" fill="#3d8b55"/><text x="377.5" y="987" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">Mapping</text><line x1="648" y1="870.0" x2="681" y2="870.0" stroke="#999" stroke-width="4"/><polygon points="695,870.0 677,859.0 677,881.0" fill="#999"/><rect x="703" y="725" width="580" height="290" rx="14" fill="#f6fbf7" stroke="#3d8b55" stroke-width="4"/><path d="M703,739 a14,14 0 0 1 14,-14 h552 a14,14 0 0 1 14,14 v50 h-580 z" fill="#3d8b55"/><text x="729" y="769" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="25" fill="#fff" font-weight="bold" text-anchor="start">2  Daily exemption</text><text x="1259" y="768" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#fff" font-weight="normal" text-anchor="end">Routine · 2 steps</text><text x="733" y="837" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">① Create a feature rule</text><text x="733" y="881" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">② Edit the mapping rule&#x27;s match</text><text x="733" y="925" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#666" font-weight="bold" text-anchor="start">Detection layer untouched</text><text x="733" y="987" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#555" font-weight="normal" text-anchor="start">Change:</text><rect x="815" y="961" width="113.16000000000001" height="38" rx="19" fill="#3f72b5"/><text x="871.58" y="987" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">Feature</text><rect x="940.16" y="961" width="113.16000000000001" height="38" rx="19" fill="#3d8b55"/><text x="996.74" y="987" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">Mapping</text><line x1="1291" y1="870.0" x2="1324" y2="870.0" stroke="#999" stroke-width="4"/><polygon points="1338,870.0 1320,859.0 1320,881.0" fill="#999"/><rect x="1346" y="725" width="580" height="290" rx="14" fill="#fff" stroke="#c9ced4" stroke-width="2"/><path d="M1346,739 a14,14 0 0 1 14,-14 h552 a14,14 0 0 1 14,14 v50 h-580 z" fill="#3b4a5c"/><text x="1372" y="769" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="25" fill="#fff" font-weight="bold" text-anchor="start">3  Onboard new rule</text><text x="1902" y="768" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#fff" font-weight="normal" text-anchor="end">As needed</text><text x="1376" y="837" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">① Wire it into detection (no change)</text><text x="1376" y="881" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="21" fill="#222" font-weight="normal" text-anchor="start">② Then follow stage 2</text><text x="1376" y="987" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#555" font-weight="normal" text-anchor="start">Change:</text><rect x="1458" y="961" width="136.92000000000002" height="38" rx="19" fill="#c0602a"/><text x="1526.46" y="987" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">Detection</text><rect x="1606.92" y="961" width="136.92000000000002" height="38" rx="19" fill="#3b4a5c"/><text x="1675.38" y="987" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">→ Stage 2</text></svg>