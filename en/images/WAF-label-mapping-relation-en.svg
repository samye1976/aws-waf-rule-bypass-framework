<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="660" viewBox="0 0 1900 660"><rect width="1900" height="660" fill="#fff"/><defs><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f72b5"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d8b55"/></marker></defs><text x="260.0" y="62" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="28" fill="#3f72b5" font-weight="bold" text-anchor="middle">Feature layer</text><text x="260.0" y="96" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="19" fill="#666" font-weight="normal" text-anchor="middle">Reusable across mapping rules</text><text x="860.0" y="62" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="28" fill="#3d8b55" font-weight="bold" text-anchor="middle">Mapping layer</text><text x="860.0" y="96" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="19" fill="#666" font-weight="normal" text-anchor="middle">One per detection rule</text><text x="1630.0" y="62" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="28" fill="#c0602a" font-weight="bold" text-anchor="middle">Detection layer</text><text x="1630.0" y="96" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="19" fill="#666" font-weight="normal" text-anchor="middle">Checks only its own exemption label</text><rect x="60" y="155.0" width="400" height="150" rx="14" fill="#eaf1fb" stroke="#3f72b5" stroke-width="3"/><text x="84" y="199.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#222" font-weight="bold" text-anchor="start">feat-path-upload</text><text x="84" y="239.0" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#444" font-weight="normal" text-anchor="start">URI starts with /api/upload</text><text x="84" y="271.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#444" font-weight="normal" text-anchor="start">→ label feat:path:upload</text><rect x="60" y="395.0" width="400" height="150" rx="14" fill="#eaf1fb" stroke="#3f72b5" stroke-width="3"/><text x="84" y="439.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#222" font-weight="bold" text-anchor="start">feat-src-partner</text><text x="84" y="479.0" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#444" font-weight="normal" text-anchor="start">Src IP in IP set partner-ips</text><text x="84" y="511.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#444" font-weight="normal" text-anchor="start">→ label feat:src:partner_ip</text><rect x="640" y="155.0" width="440" height="150" rx="14" fill="#ebf5ee" stroke="#3d8b55" stroke-width="3"/><text x="664" y="199.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#222" font-weight="bold" text-anchor="start">map-crs_sizebody</text><text x="664" y="239.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#444" font-weight="normal" text-anchor="start">match: feat:path:upload</text><text x="664" y="271.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#444" font-weight="normal" text-anchor="start">   OR feat:src:partner_ip</text><rect x="640" y="395.0" width="440" height="150" rx="14" fill="#ebf5ee" stroke="#3d8b55" stroke-width="3"/><text x="664" y="439.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#222" font-weight="bold" text-anchor="start">map-rl_global</text><text x="664" y="479.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#444" font-weight="normal" text-anchor="start">match: feat:src:partner_ip</text><rect x="1420" y="155.0" width="420" height="150" rx="14" fill="#fdf6ef" stroke="#c0602a" stroke-width="3"/><text x="1444" y="199.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#222" font-weight="bold" text-anchor="start">enforce-crs-block</text><text x="1444" y="239.0" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#444" font-weight="normal" text-anchor="start">Backfill: SizeRestrictions_Body</text><text x="1444" y="271.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#444" font-weight="normal" text-anchor="start">AND NOT exempt:crs_sizebody</text><rect x="1420" y="395.0" width="420" height="150" rx="14" fill="#fdf6ef" stroke="#c0602a" stroke-width="3"/><text x="1444" y="439.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" fill="#222" font-weight="bold" text-anchor="start">rl-global</text><text x="1444" y="479.0" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#444" font-weight="normal" text-anchor="start">Global rate limit, scope-down:</text><text x="1444" y="511.0" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#444" font-weight="normal" text-anchor="start">NOT exempt:rl_global</text><path d="M460,230 C570,230 530,230 636,230" fill="none" stroke="#3f72b5" stroke-width="4" marker-end="url(#mb)"/><path d="M460,470 C570,470 530,255 636,255" fill="none" stroke="#3f72b5" stroke-width="4" marker-end="url(#mb)"/><path d="M460,470 C570,470 530,470 636,470" fill="none" stroke="#3f72b5" stroke-width="4" marker-end="url(#mb)"/><line x1="1080" y1="230" x2="1416" y2="230" stroke="#3d8b55" stroke-width="4" marker-end="url(#mg)"/><rect x="1128.69" y="176" width="242.62" height="40" rx="20" fill="#3d8b55"/><text x="1250.0" y="202" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">exempt:crs_sizebody</text><text x="1250.0" y="266" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="17" fill="#666" font-weight="normal" text-anchor="middle">adds exemption label</text><line x1="1080" y1="470" x2="1416" y2="470" stroke="#3d8b55" stroke-width="4" marker-end="url(#mg)"/><rect x="1145.16" y="416" width="209.68" height="40" rx="20" fill="#3d8b55"/><text x="1250.0" y="442" font-family="Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="18" fill="#fff" font-weight="bold" text-anchor="middle">exempt:rl_global</text><text x="1250.0" y="506" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="17" fill="#666" font-weight="normal" text-anchor="middle">adds exemption label</text><text x="60" y="615" font-family="Helvetica Neue, Arial, DejaVu Sans, sans-serif" font-size="18" fill="#555" font-weight="normal" text-anchor="start">One feature can feed several mapping rules (feat:src:partner_ip → two); each detection rule has exactly one mapping rule and one exemption label.</text></svg>